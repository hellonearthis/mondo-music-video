[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mondo-music-video"
version = "0.1.0"
description = "A focused music-video studio with Open Actor Protocol built in"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "Pillow>=11,<13",
  "open-actor-protocol @ git+https://github.com/hodgemann/oap@64918337750dfecd736d957ecea8ad7bc4f357a8",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
mondo-music-video = "mmv.setup:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mmv*", "webapp*"]

[tool.setuptools.package-data]
webapp = ["*.html", "*.js", "*.css"]
